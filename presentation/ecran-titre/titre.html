<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:GG;src:url(node_modules/@fontsource/grenze-gotisch/files/grenze-gotisch-latin-700-normal.woff2)}
@font-face{font-family:Fell;src:url(node_modules/@fontsource/im-fell-english/files/im-fell-english-latin-400-normal.woff2)}
@font-face{font-family:Fell;font-style:italic;src:url(node_modules/@fontsource/im-fell-english/files/im-fell-english-latin-400-italic.woff2)}
@font-face{font-family:Cav;src:url(node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2)}
:root{--encre:#0f0b08;--papier:#b59d6c;--papier2:#8a7249;--os:#e6d6b0;--cire:#8f1d14;--bougie:#e09a34}
html,body{margin:0;background:#000}
#s{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--encre)}
canvas{position:absolute;inset:0}
.grain{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.9;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .28  0 0 0 0 .19  0 0 0 0 .09  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 58% 60% at 50% 46%,rgba(224,154,52,.13) 0,transparent 38%,rgba(8,5,3,.86) 80%,#030201 100%)}
.bas{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(transparent,rgba(3,2,1,.9))}
.c{position:absolute;left:0;right:0;top:215px;display:flex;flex-direction:column;align-items:center}
.sur{font:400 27px Fell;letter-spacing:.42em;text-transform:uppercase;color:var(--bougie);text-shadow:0 2px 0 #000,0 0 14px #000;margin-bottom:6px}
h1{margin:0;font:700 250px/1 GG;color:var(--os);-webkit-text-stroke:7px var(--encre);paint-order:stroke fill;text-shadow:9px 9px 0 var(--cire),0 0 60px rgba(0,0,0,.95);letter-spacing:.01em;filter:url(#tremble);transform:rotate(-1.2deg)}
.orn{display:flex;align-items:center;gap:22px;width:820px;margin-top:8px}
.orn::before,.orn::after{content:"";flex:1;height:6px;background:var(--os);border-radius:4px;filter:url(#rugueux);box-shadow:0 0 0 3px var(--encre)}
.orn svg{filter:url(#rugueux)}
h2{margin:14px 0 0;font:italic 400 76px/1 Fell;color:var(--bougie);text-shadow:4px 4px 0 #000,0 0 30px rgba(0,0,0,.9);transform:rotate(-.6deg)}
.btn{position:relative;margin-top:86px;padding:22px 64px 24px 40px;display:flex;align-items:center;gap:26px;transform:rotate(1deg);isolation:isolate;font:700 54px GG;color:var(--encre)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(170deg,var(--papier),var(--papier2));box-shadow:0 0 0 5px var(--encre),10px 12px 0 rgba(0,0,0,.6);filter:url(#rugueux)}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;mix-blend-mode:multiply;opacity:.8;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='200'><filter id='t'><feTurbulence type='fractalNoise' baseFrequency='.02' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 -2.2 1.25'/></filter><rect width='100%' height='100%' filter='url(%23t)'/></svg>")}
.sceau{width:74px;height:74px;border-radius:47% 53% 50% 50% / 55% 45% 55% 45%;background:radial-gradient(circle at 35% 30%,#d0503e,var(--cire) 55%,#3a0805);box-shadow:0 0 0 4px var(--encre),4px 5px 0 rgba(0,0,0,.5);display:grid;place-items:center;color:var(--os);font:700 40px GG;filter:url(#tremble)}
.main{margin-top:26px;font:700 44px Cav;color:var(--os);text-shadow:0 2px 0 #000,0 0 12px #000;transform:rotate(-2deg)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="tremble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
<filter id="rugueux" x="-5%" y="-20%" width="110%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
</defs></svg>
<div id="s"><canvas id="k" width="1920" height="1080"></canvas><div class="grain"></div><div class="vig"></div><div class="bas"></div>
<div class="c"><div class="sur">Un monde à prendre, tuile par tuile</div><h1>MOZAWORLD</h1>
<div class="orn"><svg width="56" height="56" viewBox="0 0 40 40"><path d="M20 2l4.2 9.8L34 6l-4.2 9.8L40 20l-10.2 4.2L34 34l-9.8-4.2L20 40l-4.2-10.2L6 34l4.2-9.8L0 20l10.2-4.2L6 6l9.8 4.2z" fill="#8f1d14" stroke="#0f0b08" stroke-width="2"/><circle cx="20" cy="20" r="5" fill="#0f0b08"/></svg></div>
<h2>Les Royaumes Mosaïque</h2>
<div class="btn"><span class="sceau">A</span>Entrer dans les royaumes</div>
<div class="main">appuyez sur A</div></div></div>
<script>
window.pret=(async()=>{const im=new Image();im.src='src.png';await im.decode();const W=1920,H=1080,k=document.getElementById('k'),g=k.getContext('2d');
g.filter='sepia(.6) saturate(.55) contrast(1.25) brightness(.5)';g.drawImage(im,-40,-60,W+80,H+45);g.filter='none';
const t=document.createElement('canvas');t.width=W;t.height=H;const tg=t.getContext('2d');tg.filter='blur(1.4px)';tg.drawImage(im,-40,-60,W+80,H+45);
const d=tg.getImageData(0,0,W,H).data,L=new Float32Array(W*H);for(let i=0;i<W*H;i++)L[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
const o=g.getImageData(0,0,W,H),p=o.data;let s=1;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const i=y*W+x;
 const gx=L[i-W+1]+2*L[i+1]+L[i+W+1]-L[i-W-1]-2*L[i-1]-L[i+W-1],gy=L[i+W-1]+2*L[i+W]+L[i+W+1]-L[i-W-1]-2*L[i-W]-L[i-W+1];
 let e=Math.min(1,Math.max(0,(Math.hypot(gx,gy)-38)/70));
 /* hachures dans les ombres */
 const h=((x+y)%9<2)&&L[i]<95?(.5*(1-L[i]/95)):0, h2=((x-y+4000)%11<2)&&L[i]<55?.45:0;
 const a=Math.min(1,e*1.25+h+h2)*(.85+.15*rnd());
 p[i*4]=p[i*4]*(1-a)+12*a;p[i*4+1]=p[i*4+1]*(1-a)+9*a;p[i*4+2]=p[i*4+2]*(1-a)+6*a}
g.putImageData(o,0,0);
/* trait tremblé : léger déplacement */
const c2=document.createElement('canvas');c2.width=W;c2.height=H;c2.getContext('2d').drawImage(k,0,0);
for(let y=0;y<H;y+=3){const dx=Math.sin(y*.045)*2.2+Math.sin(y*.17)*1.2;g.drawImage(c2,0,y,W,3,dx,y,W,3)}
await document.fonts.ready})();
</script></body></html>
