 oeil(330,560,34,-.15,.8);oeil(1640,520,30,.2,.75);oeil(118,820,22,.3,.6);oeil(1560,905,20,-.25,.55);oeil(905,985,24,.05,.5);oeil(1835,760,16,.1,.5);oeil(420,95,18,-.1,.4);
